<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2EDE4">
<title>SHARK</title>
<link rel="stylesheet" href="css/app.css">
<script>
  // Pick light or dark before anything paints
  (function () {
    try {
      var t = localStorage.getItem('shark_theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('pre-dark');
    } catch (e) { /* first launch */ }
  })();
</script>
</head>
<body>
<div id="app">
  <header id="hud" class="hud"></header>
  <main id="screen"></main>
</div>
<div id="water" class="water" aria-hidden="true"></div>
<button id="fab" class="fab" data-act="newClient" aria-label="Add a client"></button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheets"></div>
<div id="overlay" class="overlay"></div>
<div id="splash" class="splash"></div>
<div class="grain" aria-hidden="true"></div>

<script src="js/capacitor.js"></script>
<script src="js/paths.js"></script>
<script src="js/sprites.js"></script>
<script src="js/core.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
